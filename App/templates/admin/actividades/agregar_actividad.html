{% extends "admin/base-admin.html" %}
{% load static %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container py-4" style="--verde-main: #2c6e3c;">
    <div class="row justify-content-center">
       
        <div class="col-12 col-lg-10" style="max-width: 880px;">
            
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                
                <div class="card-header p-4 border-0 text-white" style="background-color: var(--verde-main);">
                    <div class="d-flex align-items-center">
                        <i class="bi bi-activity fs-2 me-3"></i>
                        <div>
                            <h4 class="fw-bold mb-0 text-white">Registrar Nueva Actividad</h4>
                            <p class="mb-0 text-white-50 small">Completa la información para habilitar una nueva actividad turística en Mongua.</p>
                        </div>
                    </div>
                </div>

                <div class="card-body p-4 bg-white">
                    <form method="POST" enctype="multipart/form-data" novalidate>
                        {% csrf_token %}

                        {% crispy form %}

                        <div class="d-flex justify-content-end gap-2 pt-3 mt-4 border-top">
                            <a href="{% url 'listar_actividades' %}" class="btn btn-outline-secondary px-4 rounded-pill">
                                Cancelar
                            </a>
                            <button type="submit" class="btn text-white px-4 rounded-pill shadow-sm fw-bold" style="background-color: var(--verde-main); border-color: var(--verde-main);">
                                <i class="bi bi-plus-circle me-1"></i> Crear Actividad
                            </button>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>
{% endblock content %}
