{% extends "admin/base-admin.html" %}
{% load static %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container py-4" style="--verde-main: #2c6e3c;">
    <div class="row justify-content-center">
        
        <div class="col-12 col-lg-10" style="max-width: 800px;">
            
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
              
                <!-- Encabezado con ícono de Lápiz y color Verde Main -->
                <div class="card-header p-4 border-0 text-white" style="background-color: var(--verde-main);">
                    <div class="d-flex align-items-center">
                        <i class="bi bi-pencil-square fs-2 me-3"></i>
                        <div>
                            <h4 class="fw-bold mb-0 text-white">Editar Actividad</h4>
                            <p class="mb-0 text-white-50 small">Modifica los detalles de la actividad turística en Mongua.</p>
                        </div>
                    </div>
                </div>

                <!-- Cuerpo con los campos en 2 columnas -->
                <div class="card-body p-4 bg-white">
                    <form method="POST" enctype="multipart/form-data" novalidate>
                        {% csrf_token %}

                        <!-- Renderizado de Crispy en grilla de 2 columnas -->
                        {% crispy form %}

                        <!-- Botones de Acción -->
                        <div class="d-flex justify-content-end gap-2 pt-3 mt-3 border-top">
                            <a href="{% url 'listar_actividades' %}" class="btn btn-outline-secondary px-4 rounded-pill">
                                Cancelar
                            </a>
                            <button type="submit" class="btn text-white px-4 rounded-pill shadow-sm fw-bold" style="background-color: var(--verde-main); border-color: var(--verde-main);">
                                <i class="bi bi-check-circle-fill me-1"></i> Guardar Cambios
                            </button>
                        </div>
                    </form>
                </div>

            </div>

        </div>
    </div>
</div>
{% endblock content %}
