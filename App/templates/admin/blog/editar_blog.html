{% extends "admin/base-admin.html" %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-12 col-md-10 col-lg-8" style="max-width: 720px;">
            <div class="card shadow-sm border-0 rounded-4 overflow-hidden">
                
                  <div class="card-header p-4 border-0 text-white" style="background-color: var(--verde-main);">
                    <div class="d-flex align-items-center">
                        <i class="bi bi-pencil-square fs-2 me-3"></i>
                        <div>
                            <h4 class="fw-bold mb-0 text-white">Editar Publicación de Blog</h4>
                            <p class="mb-0 text-white-50 small">Modifica los detalles de la publicación de blog en Mongua.</p>
                        </div>
                    </div>
                </div>

                <div class="card-body p-4 bg-white">
                    <form method="POST" enctype="multipart/form-data">
                        {% csrf_token %}
                        
                        {{ form|crispy }}

                        <div class="d-flex justify-content-end gap-2 pt-3 mt-4 border-top">
                            <a href="{% url 'listar_blog' %}" class="btn btn-outline-secondary px-4 rounded-pill">
                                Cancelar
                            </a>
                            <button type="submit" class="btn btn-success px-4 rounded-pill shadow-sm fw-bold">
                                <i class="bi bi-save me-1"></i>Guardar Cambios
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
