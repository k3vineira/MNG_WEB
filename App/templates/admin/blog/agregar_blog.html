{% extends "admin/base-admin.html" %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container py-3" style="--verde-main: #2c6e3c;">
    <div class="row justify-content-center">
        <!-- Ancho reducido a máximo 550px -->
        <div class="col-12 col-md-8 col-lg-6" style="max-width: 550px;">
            
            <div class="card shadow-sm border-0 rounded-3 overflow-hidden">
                
                <!-- Encabezado compacto -->
                <div class="card-header py-2 px-3 text-white" style="background-color: var(--verde-main);">
                    <h6 class="mb-0 text-center fw-bold">Publicar Información</h6>
                </div>

                <!-- Cuerpo del formulario compacto -->
                <div class="card-body p-3 bg-white">
                    <form method="POST" enctype="multipart/form-data" novalidate> 
                        {% csrf_token %}
                        
                        <!-- Formulario de Crispy Forms -->
                        {{ form|crispy }}

                        <!-- Botones de Acción pequeños -->
                        <div class="d-flex justify-content-end gap-2 pt-2 mt-3 border-top">
                            <a href="#" class="btn btn-sm btn-outline-secondary px-3 rounded-pill">
                                Cancelar
                            </a>
                            <button type="submit" class="btn btn-sm text-white px-3 rounded-pill shadow-sm fw-bold" style="background-color: var(--verde-main); border-color: var(--verde-main);">
                                Guardar Publicación
                            </button>
                        </div>
                    </form>
                </div>

            </div>
        </div>
    </div>
</div>
{% endblock %}
