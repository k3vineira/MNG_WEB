{% extends "admin/base-admin.html" %}
{% load static %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                
                <div class="card-header p-4 border-0 text-white" style="background-color: var(--verde-main);">
                    <div class="d-flex align-items-center">
                        <i class="bi bi-tag-fill fs-2 me-3"></i>
                        <div>
                            <h4 class="fw-bold mb-0 text-white">Registrar Nueva Tarifa</h4>
                            <p class="mb-0 text-white-50 small">Asigna los precios para un paquete y temporada turística en Mongua.</p>
                        </div>
                    </div>
                </div>

                <!-- Cuerpo del Formulario -->
                <div class="card-body p-4 bg-white">
                    <form method="POST" novalidate>
                        {% csrf_token %}

                        <!-- Crispy renderiza los campos del formulario -->
                        {{ form|crispy }}

                        <!-- Botones de Acción -->
                        <div class="d-flex justify-content-end gap-2 pt-3 mt-4 border-top">
                            <a href="#" class="btn btn-outline-secondary px-4 rounded-pill">
                                Cancelar
                            </a>
                            <button type="submit" class="btn text-white px-4 rounded-pill shadow-sm fw-bold" style="background-color: var(--verde-mainEditar Tarifa); border-color: var(--verde-oscuro);">
                                <i class="bi bi-plus-circle me-1"></i> Crear Tarifa
                            </button>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>
{% endblock content %}
