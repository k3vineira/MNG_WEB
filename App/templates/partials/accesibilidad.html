{% load static %}
<link rel="stylesheet" href="{% static 'css/accesibilidad.css' %}">
{% csrf_token %}
{{ request.session.a11y_settings|json_script:"a11y-session-data" }}
<!-- ── Botón flotante de Accesibilidad ── -->
<button
  id="a11y-btn"
  onclick="A11y.toggle()"
  aria-label="Opciones de accesibilidad"
  aria-expanded="false"
  class="btn btn-success a11y-btn-main position-fixed shadow-lg p-0 d-flex align-items-center justify-content-center rounded-circle"
  style="
    bottom: 25px !important;
    right: 25px !important;
    width: 50px !important;
    height: 50px !important;
    z-index: 999999 !important;
    display: flex !important;
    visibility: visible !important;
  "
>
  <i class="bi bi-universal-access fs-4"></i>
</button>

<style>
  /* Edge panel para móviles */
  @media (max-width: 768px) {
    #a11y-btn {
      bottom: 20px !important;
      right: 15px !important;
      transform: translateX(35px);
      opacity: 0.7;
      border-radius: 30px 0 0 30px !important;
      transition:
        transform 0.3s ease,
        opacity 0.3s ease,
        border-radius 0.3s ease !important;
    }
    #a11y-btn[aria-expanded="true"] {
      transform: translateX(0);
      opacity: 1;
      border-radius: 50% !important;
    }
  }
</style>

<!-- ── Panel de Accesibilidad ── -->
<div
  id="a11y-panel"
  class="card a11y-panel position-fixed d-none shadow-lg"
  role="dialog"
  aria-modal="true"
  aria-label="Panel de accesibilidad"
  style="
    bottom: 85px;
    right: 25px;
    width: 320px;
    max-width: 90vw;
    z-index: 99999 !important;
  "
>
  <!-- Header del Panel con Botón Reset -->
  <div
    class="a11y-panel-header d-flex justify-content-between align-items-center px-3 py-2 border-bottom"
  >
    <span class="small fw-semibold d-flex align-items-center gap-2">
      <i class="bi bi-universal-access fs-5"></i>
      <span class="d-none d-sm-inline">Accesibilidad</span>
    </span>
    <button
      class="btn btn-sm py-0 px-2 u-style-bc9efe64"
      id="btn-reset"
      title="Restablecer todas las opciones"
    >
      <i class="bi bi-arrow-counterclockwise me-1"></i
      ><span class="d-none d-sm-inline">Restablecer</span>
    </button>
  </div>

  <!-- Barra de Navegación (Tabs) - PROTEGIDA DE CAMBIOS -->
  <div class="a11y-tabs-nav border-bottom d-flex" role="tablist">
    <button
      class="a11y-tab-btn a11y-tab-active"
      id="tab-tamaño"
      role="tab"
      aria-selected="true"
      aria-controls="panel-tamaño"
    >
      <i class="bi bi-fonts"></i>
      <span class="d-none d-sm-inline">Tamaño</span>
    </button>
    <button
      class="a11y-tab-btn"
      id="tab-visualización"
      role="tab"
      aria-selected="false"
      aria-controls="panel-visualización"
    >
      <i class="bi bi-palette"></i>
      <span class="d-none d-sm-inline">Color</span>
    </button>
    <button
      class="a11y-tab-btn"
      id="tab-lectura"
      role="tab"
      aria-selected="false"
      aria-controls="panel-lectura"
    >
      <i class="bi bi-book"></i>
      <span class="d-none d-sm-inline">Lectura</span>
    </button>
    <button
      class="a11y-tab-btn"
      id="tab-animaciones"
      role="tab"
      aria-selected="false"
      aria-controls="panel-animaciones"
    >
      <i class="bi bi-play-circle"></i>
      <span class="d-none d-sm-inline">Animaciones</span>
    </button>
  </div>

  <!-- Contenido del Panel - PROTEGIDO DE CAMBIOS -->
  <div class="a11y-panel-content p-3 d-flex flex-column gap-3">
    <!-- TAB 1: Tamaño -->
    <div
      id="panel-tamaño"
      class="a11y-tab-panel a11y-tab-panel-active"
      role="tabpanel"
      aria-labelledby="tab-tamaño"
    >
      <!-- Brillo -->
      <div class="mb-2">
        <div class="d-flex justify-content-between align-items-center mb-1">
          <label for="sl-bright" class="form-label small mb-0"
            ><i class="bi bi-brightness-high text-warning"></i> Brillo</label
          >
          <span class="small fw-bold" id="val-bright">100%</span>
        </div>
        <input
          type="range"
          class="form-range form-range-sm"
          id="sl-bright"
          min="50"
          max="120"
          value="100"
          step="1"
        />
      </div>

      <!-- Tamaño de texto -->
      <div class="mb-2">
        <div class="d-flex justify-content-between align-items-center mb-1">
          <label for="sl-font" class="form-label small mb-0"
            ><i class="bi bi-textbox text-info"></i> Texto</label
          >
          <span class="small fw-bold" id="val-font">85%</span>
        </div>
        <input
          type="range"
          class="form-range form-range-sm"
          id="sl-font"
          min="80"
          max="160"
          value="85"
          step="1"
        />
      </div>
    </div>

    <!-- TAB 2: Visualización -->
    <div
      id="panel-visualización"
      class="a11y-tab-panel u-style-cb458930"
      role="tabpanel"
      aria-labelledby="tab-visualización"
    >
      <!-- Tema de Colores -->
      <div class="mb-2">
        <label for="sel-theme" class="form-label small mb-1"
          ><i class="bi bi-palette text-primary"></i> Tema</label
        >
        <select id="sel-theme" class="form-select form-select-sm">
          <option value="auto">Automático</option>
          <option value="light">Claro</option>
          <option value="dark">Oscuro</option>
          <option value="high-contrast">Alto Contraste</option>
        </select>
      </div>

      <!-- Saturación -->
      <div class="mb-2">
        <div class="d-flex justify-content-between align-items-center mb-1">
          <label for="sl-saturate" class="form-label small mb-0"
            ><i class="bi bi-circle-fill text-success"></i> Saturación</label
          >
          <span class="small fw-bold" id="val-saturate">100%</span>
        </div>
        <input
          type="range"
          class="form-range form-range-sm"
          id="sl-saturate"
          min="0"
          max="100"
          value="100"
          step="5"
        />
      </div>

      <div class="row g-2">
        <div class="col-6">
          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" role="switch" id="tog-monochrome" />
            <label class="form-check-label small" for="tog-monochrome"><i class="bi bi-circle-half"></i> Grises</label>
          </div>
        </div>
        <div class="col-6">
          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" role="switch" id="tog-invert" />
            <label class="form-check-label small" for="tog-invert"><i class="bi bi-arrow-down-up"></i> Invertir</label>
          </div>
        </div>
        <div class="col-6">
          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" role="switch" id="tog-cursor" />
            <label class="form-check-label small" for="tog-cursor"><i class="bi bi-cursor"></i> Cursor</label>
          </div>
        </div>
        <div class="col-6">
          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" role="switch" id="tog-links" />
            <label class="form-check-label small" for="tog-links"><i class="bi bi-link-45deg"></i> Enlaces</label>
          </div>
        </div>
      </div>
    </div>

    <!-- TAB 3: Lectura -->
    <div
      id="panel-lectura"
      class="a11y-tab-panel"
      role="tabpanel"
      aria-labelledby="tab-lectura"
    >
      <div class="form-check form-switch mb-2">
        <input class="form-check-input" type="checkbox" role="switch" id="tog-dyslexic" />
        <label class="form-check-label small" for="tog-dyslexic"><i class="bi bi-fonts"></i> Fuente Dislexia</label>
      </div>
      <div class="form-check form-switch mb-2">
        <input class="form-check-input" type="checkbox" role="switch" id="tog-spacing" />
        <label class="form-check-label small" for="tog-spacing"><i class="bi bi-distribute-vertical"></i> Espaciado de Texto</label>
      </div>
      <div class="form-check form-switch mb-2">
        <input class="form-check-input" type="checkbox" role="switch" id="tog-focus" />
        <label class="form-check-label small" for="tog-focus"><i class="bi bi-align-center"></i> Guía de Lectura</label>
      </div>
    </div>

    <!-- TAB 4: Animaciones -->
    <div
      id="panel-animaciones"
      class="a11y-tab-panel"
      role="tabpanel"
      aria-labelledby="tab-animaciones"
    >
      <div class="form-check form-switch mb-2">
        <input class="form-check-input" type="checkbox" role="switch" id="tog-animations" />
        <label class="form-check-label small" for="tog-animations"><i class="bi bi-pause-circle"></i> Pausar Animaciones</label>
      </div>
    </div>
  </div>

  <!-- Contenedor para Guía de Lectura -->
  <div id="a11y-reading-guide" class="d-none" style="position:fixed; top:50%; left:0; width:100%; height:4px; background:#ffeb3b; z-index:999998; box-shadow: 0 0 10px rgba(0,0,0,0.5); pointer-events:none; transform: translateY(-50%);"></div>
  <div id="a11y-focus-backdrop" class="d-none" style="position:fixed; top:0; left:0; width:100%; height:100%; z-index:999997; pointer-events:none; background: linear-gradient(to bottom, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0.7) 40%, transparent 40%, transparent 60%, rgba(0,0,0,0.7) 60%, rgba(0,0,0,0.7) 100%);"></div>

  <!-- Footer del Panel -->
  <div
    class="a11y-panel-footer border-top d-flex align-items-center justify-content-between px-3 py-2 u-style-8cba01a2"
  >
    <div class="d-flex align-items-center gap-2">
      <span class="badge rounded-circle p-1 u-style-3fa034ce"></span>
      <span>Guardado automáticamente</span>
    </div>
    <div class="d-none d-sm-block"><kbd>Alt</kbd>+<kbd>A</kbd></div>
  </div>
</div>

<!-- ── Toast de confirmación ── -->
<div
  id="a11y-toast"
  class="toast position-fixed border-0 u-style-d67f9080"
  role="status"
  aria-live="polite"
>
  <div class="d-flex">
    <div class="toast-body small fw-semibold" id="a11y-toast-msg"></div>
    <button
      class="btn-close btn-close-white me-2 m-auto"
      data-bs-dismiss="toast"
    ></button>
  </div>
</div>

<script>
  /* ── Widget Avanzado de Accesibilidad ── */
  (function () {
    // Valores por defecto
    var D = {
      bright: 100,
      font: 100,
      theme: "auto",
      saturate: 100,
      bigCursor: false,
      hlLinks: false,
      dyslexic: false,
      spacing: false,
      animations: true,
      focus: false,
      monochrome: false,
      invert: false,
    };
    var s = Object.assign({}, D);
    var _toast = null;
    var currentTab = "tamaño";

    function save() {
      try {
        localStorage.setItem("a11y", JSON.stringify(s));
        
        // Guardar en sesión de Django mediante fetch
        var csrfToken = document.querySelector('[name=csrfmiddlewaretoken]');
        if (csrfToken) {
          fetch('/api/accesibilidad/save/', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'X-CSRFToken': csrfToken.value
            },
            body: JSON.stringify(s)
          }).catch(function(e) { console.error("Error guardando accesibilidad", e); });
        }
      } catch (_) {}
    }
    function load() {
      try {
        var serverDataEl = document.getElementById("a11y-session-data");
        var serverData = null;
        if (serverDataEl && serverDataEl.textContent && serverDataEl.textContent !== "null") {
           serverData = JSON.parse(serverDataEl.textContent);
        }
        
        var localDataStr = localStorage.getItem("a11y");
        var localData = localDataStr ? JSON.parse(localDataStr) : null;
        
        // Priorizar datos del servidor (si la sesión sigue viva) o fallback local
        var activeData = serverData || localData;
        
        if (activeData) {
          s = Object.assign({}, D, activeData);
          if (s.font === 85) {
            s.font = 100;
            save();
          }
        }
      } catch (_) {}
    }

    // Paletas de colores se eliminaron, ahora es manejado por CSS y Bootstrap nativo

    // ═══ FUNCIONES DE TABS ═══
    function switchTab(tabName) {
      // Ocultar todos los tabs
      var panels = document.querySelectorAll(".a11y-tab-panel");
      panels.forEach(function (p) {
        p.style.display = "none";
        p.classList.remove("a11y-tab-panel-active");
      });

      // Desactivar todos los botones
      var btns = document.querySelectorAll(".a11y-tab-btn");
      btns.forEach(function (b) {
        b.classList.remove("a11y-tab-active");
        b.setAttribute("aria-selected", "false");
      });

      // Activar tab seleccionado
      var activePanel = document.getElementById("panel-" + tabName);
      var activeBtn = document.getElementById("tab-" + tabName);

      if (activePanel) {
        activePanel.style.display = "block";
        activePanel.classList.add("a11y-tab-panel-active");
      }
      if (activeBtn) {
        activeBtn.classList.add("a11y-tab-active");
        activeBtn.setAttribute("aria-selected", "true");
      }

      currentTab = tabName;
    }

    function applyBright(v) {
      var el = document.getElementById("a11y-bright-style");
      if (!el) {
        el = document.createElement("style");
        el.id = "a11y-bright-style";
        document.head.appendChild(el);
      }
      el.textContent =
        +v === 100 ? "" : "html{filter:brightness(" + v + "%)!important}";
    }

    function applyFont(v) {
      var baseSize = 16;
      document.documentElement.style.fontSize = (v / 100) * baseSize + "px";
    }

    function applySaturate(v) {
      var el = document.getElementById("a11y-saturate-style");
      if (!el) {
        el = document.createElement("style");
        el.id = "a11y-saturate-style";
        document.head.appendChild(el);
      }
      el.textContent =
        +v === 100 ? "" : "html{filter:saturate(" + v + "%)!important}";
    }

    function applyTheme(theme) {
      document.documentElement.removeAttribute("data-bs-theme");
      document.documentElement.removeAttribute("data-a11y-theme");
      
      if (theme === "light" || theme === "dark") {
        document.documentElement.setAttribute("data-bs-theme", theme);
      } else if (theme === "high-contrast") {
        document.documentElement.setAttribute("data-bs-theme", "dark");
        document.documentElement.setAttribute("data-a11y-theme", "high-contrast");
      }
    }

    function applyBigCursor(on) {
      if (on) {
        document.documentElement.setAttribute("data-a11y-cursor", "true");
      } else {
        document.documentElement.removeAttribute("data-a11y-cursor");
      }
    }

    function applyLinks(on) {
      if (on) {
        document.documentElement.setAttribute("data-a11y-links", "true");
      } else {
        document.documentElement.removeAttribute("data-a11y-links");
      }
    }

    function applyToggleAttr(attr, on) {
      if (on) {
        document.documentElement.setAttribute(attr, "true");
      } else {
        document.documentElement.removeAttribute(attr);
      }
    }

    function applyFocus(on) {
      var backdrop = document.getElementById("a11y-focus-backdrop");
      var guide = document.getElementById("a11y-reading-guide");
      if (backdrop && guide) {
        if (on) {
          backdrop.classList.remove("d-none");
          guide.classList.remove("d-none");
          document.addEventListener("mousemove", updateFocusPosition);
        } else {
          backdrop.classList.add("d-none");
          guide.classList.add("d-none");
          document.removeEventListener("mousemove", updateFocusPosition);
        }
      }
    }

    function updateFocusPosition(e) {
      var backdrop = document.getElementById("a11y-focus-backdrop");
      var guide = document.getElementById("a11y-reading-guide");
      if (backdrop && guide) {
        var y = e.clientY;
        guide.style.top = y + "px";
        var perc = (y / window.innerHeight) * 100;
        backdrop.style.background = "linear-gradient(to bottom, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0.7) calc(" + perc + "% - 50px), transparent calc(" + perc + "% - 50px), transparent calc(" + perc + "% + 50px), rgba(0,0,0,0.7) calc(" + perc + "% + 50px), rgba(0,0,0,0.7) 100%)";
      }
    }

    function syncUI() {
      ["sl-bright", "sl-font", "sl-saturate"].forEach(function (id) {
        var el = document.getElementById(id);
        if (!el) return;
        var key = id.replace("sl-", "");
        var abbr = { bright: "bright", font: "font", saturate: "saturate" };
        el.value = s[abbr[key]];
      });

      var vb = document.getElementById("val-bright");
      if (vb) vb.textContent = s.bright + "%";
      var vf = document.getElementById("val-font");
      if (vf) vf.textContent = s.font + "%";
      var vsat = document.getElementById("val-saturate");
      if (vsat) vsat.textContent = s.saturate + "%";

      var selTheme = document.getElementById("sel-theme");
      if (selTheme) selTheme.value = s.theme;

      ["tog-cursor", "tog-links", "tog-dyslexic", "tog-spacing", "tog-focus", "tog-monochrome", "tog-invert"].forEach(function (id) {
        var el = document.getElementById(id);
        if (!el) return;
        var key = { 
          "tog-cursor": "bigCursor", 
          "tog-links": "hlLinks",
          "tog-dyslexic": "dyslexic",
          "tog-spacing": "spacing",
          "tog-focus": "focus",
          "tog-monochrome": "monochrome",
          "tog-invert": "invert"
        }[id];
        el.checked = s[key];
      });

      var togAnim = document.getElementById("tog-animations");
      if (togAnim) {
        // tog-animations is "Pause animations" so if s.animations is true (animations enabled), checkbox is false
        togAnim.checked = !s.animations;
      }
    }

    function showToast(msg) {
      var el = document.getElementById("a11y-toast");
      var me = document.getElementById("a11y-toast-msg");
      if (!el || !me) return;
      me.textContent = msg;
      try {
        if (typeof bootstrap !== "undefined" && bootstrap.Toast) {
          if (!_toast) _toast = new bootstrap.Toast(el, { delay: 2000 });
          _toast.show();
        } else {
          el.classList.add("show");
          setTimeout(function () {
            el.classList.remove("show");
          }, 2000);
        }
      } catch (e) {
        el.classList.add("show");
        setTimeout(function () {
          el.classList.remove("show");
        }, 2000);
      }
    }

    function toggle() {
      var p = document.getElementById("a11y-panel");
      var b = document.getElementById("a11y-btn");
      if (!p || !b) return;
      var open = p.classList.contains("d-none");
      p.classList.toggle("d-none", !open);
      b.setAttribute("aria-expanded", open ? "true" : "false");
      if (open)
        setTimeout(function () {
          var f = p.querySelector("button,input,select");
          if (f) f.focus();
        }, 50);
    }

    function reset() {
      s = Object.assign({}, D);
      try {
        localStorage.removeItem("a11y");
      } catch (_) {}
      applyBright(100);
      applyFont(100);
      applyTheme("auto");
      applySaturate(100);
      applyBigCursor(false);
      applyLinks(false);
      applyToggleAttr("data-a11y-dyslexic", false);
      applyToggleAttr("data-a11y-spacing", false);
      applyToggleAttr("data-a11y-animations", true);
      applyToggleAttr("data-a11y-monochrome", false);
      applyToggleAttr("data-a11y-invert", false);
      applyFocus(false);
      syncUI();
      showToast("Todas las opciones restablecidas ✓");
    }

    function isMobileView() {
      return window.innerWidth <= 768;
    }

    function init() {
      load();
      applyBright(s.bright);
      applyFont(s.font);
      applyTheme(s.theme);
      applySaturate(s.saturate);
      applyBigCursor(s.bigCursor);
      applyLinks(s.hlLinks);
      applyToggleAttr("data-a11y-dyslexic", s.dyslexic);
      applyToggleAttr("data-a11y-spacing", s.spacing);
      applyToggleAttr("data-a11y-animations", s.animations);
      applyToggleAttr("data-a11y-monochrome", s.monochrome);
      applyToggleAttr("data-a11y-invert", s.invert);
      applyFocus(s.focus);
      syncUI();

      // ═══ INICIALIZAR TABS ═══
      var tabBtns = document.querySelectorAll(".a11y-tab-btn");
      tabBtns.forEach(function (btn) {
        btn.addEventListener("click", function () {
          var tabName = this.id.replace("tab-", "");
          switchTab(tabName);
        });
        btn.addEventListener("keydown", function (e) {
          if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
            e.preventDefault();
            var allBtns = Array.from(
              document.querySelectorAll(".a11y-tab-btn"),
            );
            var currentIndex = allBtns.indexOf(this);
            var nextIndex =
              e.key === "ArrowRight"
                ? (currentIndex + 1) % allBtns.length
                : (currentIndex - 1 + allBtns.length) % allBtns.length;
            var nextBtn = allBtns[nextIndex];
            nextBtn.focus();
            nextBtn.click();
          }
        });
      });

      // Brillo
      var slBright = document.getElementById("sl-bright");
      if (slBright)
        slBright.addEventListener("input", function (e) {
          s.bright = +e.target.value;
          applyBright(s.bright);
          var v = document.getElementById("val-bright");
          if (v) v.textContent = s.bright + "%";
          save();
        });

      // Tamaño de fuente
      var slFont = document.getElementById("sl-font");
      if (slFont)
        slFont.addEventListener("input", function (e) {
          s.font = +e.target.value;
          applyFont(s.font);
          var v = document.getElementById("val-font");
          if (v) v.textContent = s.font + "%";
          save();
        });

      // Tema
      var selTheme = document.getElementById("sel-theme");
      if (selTheme)
        selTheme.addEventListener("change", function (e) {
          s.theme = e.target.value;
          applyTheme(s.theme);
          save();
          showToast("Tema: " + e.target.options[e.target.selectedIndex].text);
        });

      // Saturación
      var slSaturate = document.getElementById("sl-saturate");
      if (slSaturate)
        slSaturate.addEventListener("input", function (e) {
          s.saturate = +e.target.value;
          applySaturate(s.saturate);
          var v = document.getElementById("val-saturate");
          if (v) v.textContent = s.saturate + "%";
          save();
        });

      // Cursor grande
      var togCursor = document.getElementById("tog-cursor");
      if (togCursor)
        togCursor.addEventListener("change", function (e) {
          s.bigCursor = e.target.checked;
          applyBigCursor(s.bigCursor);
          save();
          showToast(
            s.bigCursor ? "🔍 Cursor grande activado" : "🔍 Cursor normal",
          );
        });

      // Enlaces resaltados
      var togLinks = document.getElementById("tog-links");
      if (togLinks)
        togLinks.addEventListener("change", function (e) {
          s.hlLinks = e.target.checked;
          applyLinks(s.hlLinks);
          save();
          showToast(s.hlLinks ? "🔗 Enlaces resaltados" : "🔗 Enlaces normales");
        });

      // Nuevas opciones avanzadas
      function bindToggleAttr(id, key, attr, icon, msgOn, msgOff) {
        var el = document.getElementById(id);
        if (el) {
          el.addEventListener("change", function (e) {
            s[key] = e.target.checked;
            applyToggleAttr(attr, s[key]);
            save();
            showToast(icon + " " + (s[key] ? msgOn : msgOff));
          });
        }
      }

      bindToggleAttr("tog-dyslexic", "dyslexic", "data-a11y-dyslexic", "🔤", "Fuente dislexia activada", "Fuente normal");
      bindToggleAttr("tog-spacing", "spacing", "data-a11y-spacing", "📏", "Espaciado aumentado", "Espaciado normal");
      bindToggleAttr("tog-monochrome", "monochrome", "data-a11y-monochrome", "⚫", "Modo escala de grises", "Color restaurado");
      bindToggleAttr("tog-invert", "invert", "data-a11y-invert", "🔄", "Colores invertidos", "Colores restaurados");

      var togFocus = document.getElementById("tog-focus");
      if (togFocus) {
        togFocus.addEventListener("change", function(e) {
          s.focus = e.target.checked;
          applyFocus(s.focus);
          save();
          showToast("🎯 Guía de lectura " + (s.focus ? "activada" : "desactivada"));
        });
      }

      var togAnim = document.getElementById("tog-animations");
      if (togAnim) {
        togAnim.addEventListener("change", function(e) {
          // togAnim is true when animations are PAUSED
          s.animations = !e.target.checked; 
          applyToggleAttr("data-a11y-animations", s.animations);
          save();
          showToast("⏸️ Animaciones " + (e.target.checked ? "pausadas" : "reanudadas"));
        });
      }

      // Botón reset
      var btnReset = document.getElementById("btn-reset");
      if (btnReset) btnReset.addEventListener("click", reset);

      // Cerrar panel al hacer clic fuera
      document.addEventListener("click", function (e) {
        var p = document.getElementById("a11y-panel");
        var b = document.getElementById("a11y-btn");
        if (
          p &&
          b &&
          !p.classList.contains("d-none") &&
          !p.contains(e.target) &&
          !b.contains(e.target)
        ) {
          p.classList.add("d-none");
          b.setAttribute("aria-expanded", "false");
        }
      });

      // Atajos de teclado
      document.addEventListener("keydown", function (e) {
        if (e.altKey && e.key.toLowerCase() === "a") {
          e.preventDefault();
          toggle();
        }
        if (e.altKey && e.key.toLowerCase() === "r") {
          e.preventDefault();
          reset();
        }
      });

      // Escuchar redimensionado para recalcular tamaño base
      window.addEventListener("resize", function () {
        applyFont(s.font);
      });
    }

    window.A11y = { toggle: toggle, reset: reset };

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", init);
    } else {
      init();
    }
  })();
</script>
